[package]
name = "git-wippy"
description = "Git stash with super powers"
documentation = "https://github.com/mekwall/git-wippy"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"

[[bin]]
name = "git-wippy"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "string", "help", "usage", "error-context"] }
clap-cargo = "0.18"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "process", "fs"] }
anyhow = "1.0.104"
chrono = "0.4.45"
dialoguer = "0.12.0"
async-trait = "0.1.92"
futures = "0.3.34"
fluent = "0.17.0"
unic-langid = "0.9.6"

[dev-dependencies]
tokio-test = "0.4.5"
assert_cmd = "2.2"
tempfile = "3.27"
mockall = "0.15"
async-trait = "0.1.92"
regex = "1.13"
predicates = "3.1.4"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "process", "fs"] }
